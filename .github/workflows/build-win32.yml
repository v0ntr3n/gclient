name: Build & Verify Kestrel Canvas Win32 (VS2022 v143 x86)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: build-win32-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  validate-and-unit-test:
    name: Validate Tools, Proto2 Schemas & Offline PE/Patch Suite
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check Python tools & run offline patcher + PE32/PE32+ gate unit tests
        shell: pwsh
        run: |
          python -m py_compile tools/validate_resources.py
          python -m py_compile tools/patch_cocos2dx.py
          python -m py_compile tools/audit_pe_dependencies.py
          python tests/test_patch_and_pe_validator.py

      - name: Verify zero prebuilt stale DLLs tracked in repository
        shell: pwsh
        run: |
          $stale = Get-ChildItem -Recurse -File -Include *.dll,*.exe,*.pdb,*.pyc | Where-Object { $_.FullName -notmatch '\\(build|dist|external)\\' }
          if ($stale) {
            Write-Error ("Tracked binary artifacts are prohibited in source tree: " + ($stale.FullName -join ", "))
            exit 1
          }

  build-win32:
    name: Build, Audit & Smoke-Test Win32 (x86 v143 /MD Release)
    needs: validate-and-unit-test
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize structured CI log capture
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ci_logs | Out-Null
          "Init" | Set-Content -Path ci_logs/last_step.txt -Encoding UTF8
          "" | Set-Content -Path ci_logs/error.log -Encoding UTF8

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify Visual Studio 2022 (MSVC v143 x86), Windows SDK & CMake toolchain
        id: vs-env
        shell: pwsh
        run: |
          "Verify VS2022 v143 x86 toolchain" | Set-Content ci_logs/last_step.txt
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installPath = (& $vswhere -version "[17.0,18.0)" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if (-not $installPath) { throw "Visual Studio 2022 with x86 VC++ v143 toolset not found." }
          $vcvars32 = Join-Path $installPath "VC\Auxiliary\Build\vcvars32.bat"
          if (-not (Test-Path -LiteralPath $vcvars32)) { throw "Missing vcvars32.bat at $vcvars32" }

          $vcRedistRoot = Join-Path $installPath "VC\Redist\MSVC"
          $vcRedistCrt = Get-ChildItem -LiteralPath $vcRedistRoot -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x86\Microsoft.VC143.CRT" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $vcRedistCrt) { throw "Unable to locate x86 Microsoft.VC143.CRT redistributable folder under $vcRedistRoot" }

          $dumpbin = Get-ChildItem -LiteralPath (Join-Path $installPath "VC\Tools\MSVC") -Recurse -Filter "dumpbin.exe" |
            Where-Object { $_.FullName -match "Hostx64\\x86|Hostx86\\x86" } |
            Select-Object -First 1 -ExpandProperty FullName

          "vcvars32=$vcvars32" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
          "vcredist_x86=$vcRedistCrt" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8
          "dumpbin=$dumpbin" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding UTF8

          cmd /c "`"$vcvars32`" >nul && cl 2>&1 && cmake --version && msbuild -version" 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Restore cached vcpkg x86-windows (/MD v143) packages
        id: cache-vcpkg
        uses: actions/cache/restore@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x86-windows-v143-v5-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: |
            vcpkg-x86-windows-v143-
            vcpkg-x86-win-

      - name: Install Win32 x86 (/MD) dependencies via vcpkg
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "Install vcpkg x86-windows dependencies" | Set-Content ci_logs/last_step.txt
          $vcpkg = "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe"
          & $vcpkg install `
            sqlite3:x86-windows `
            protobuf:x86-windows `
            curl:x86-windows `
            openssl:x86-windows `
            zlib:x86-windows `
            glew:x86-windows `
            pthreads:x86-windows 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg x86-windows cache eagerly
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:/vcpkg/installed
          key: vcpkg-x86-windows-v143-v5-${{ hashFiles('CMakeLists.txt') }}

      - name: Restore cached Cocos2d-x 2.2.6 + rebuilt LuaJIT 2.0.1 (v143 x86 /MD)
        id: cache-cocos
        uses: actions/cache/restore@v4
        with:
          path: |
            external/cocos2d-x-2.2.6
            build/luajit-provenance.json
          key: cocos2dx-2.2.6-luajit201-v143-v7-${{ hashFiles('tools/patch_cocos2dx.py', 'tools/build_luajit_vs2022.ps1') }}

      - name: Fetch stock Cocos2d-x 2.2.6 & 3rd-party headers
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "Fetch stock Cocos2d-x 2.2.6" | Set-Content ci_logs/last_step.txt
          New-Item -ItemType Directory -Force -Path external | Out-Null
          git clone --branch cocos2d-x-2.2.6 --depth 1 https://github.com/cocos2d/cocos2d-x.git external/cocos2d-x-2.2.6 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git clone --branch v2-deps-4 --depth 1 https://github.com/cocos2d/cocos2d-x-3rd-party-libs-bin.git external/deps-tmp 2>&1 | Tee-Object -FilePath ci_logs/error.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -c "import shutil; shutil.copytree('external/deps-tmp', 'external/cocos2d-x-2.2.6', dirs_exist_ok=True, ignore=shutil.ignore_patterns('.git'))" 2>&1 | Tee-Object -FilePath ci_logs/error.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Recurse -Force external\deps-tmp

      - name: Patch Cocos2d-x 2.2.6 (fail-closed version/guard/UCRT/v143 migration)
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "Patch Cocos2d-x 2.2.6" | Set-Content ci_logs/last_step.txt
          python tools/patch_cocos2dx.py external/cocos2d-x-2.2.6 `
            --vcpkg-installed "$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows" 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build LuaJIT 2.0.1 from source (MSVC v143 Win32 x86 /MD + PDB)
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "Build LuaJIT 2.0.1 from source (v143 x86 /MD)" | Set-Content ci_logs/last_step.txt
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/build_luajit_vs2022.ps1 `
            -CocosRoot "${{ github.workspace }}/external/cocos2d-x-2.2.6" `
            -ProvenanceOut "${{ github.workspace }}/build/luajit-provenance.json" 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Cocos2d-x 2.2.6 Win32 libraries (Platform=Win32, PlatformToolset=v143, /MD)
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          "Build Cocos2d-x 2.2.6 Win32 v143 libraries" | Set-Content ci_logs/last_step.txt
          $vsDev = "${{ steps.vs-env.outputs.vcvars32 }}"
          $outDir = "${{ github.workspace }}\external\cocos2d-x-2.2.6\Release.win32\\"
          $projects = @(
            "external\cocos2d-x-2.2.6\external\Box2D\proj.win32\Box2D.vcxproj",
            "external\cocos2d-x-2.2.6\external\chipmunk\proj.win32\chipmunk.vcxproj",
            "external\cocos2d-x-2.2.6\cocos2dx\proj.win32\cocos2d.vcxproj",
            "external\cocos2d-x-2.2.6\CocosDenshion\proj.win32\CocosDenshion.vcxproj",
            "external\cocos2d-x-2.2.6\extensions\proj.win32\libExtensions.vcxproj",
            "external\cocos2d-x-2.2.6\scripting\lua\proj.win32\liblua.vcxproj"
          )
          foreach ($proj in $projects) {
            Write-Host "=== Building $proj (Win32 | Release | v143) ==="
            cmd /c "`"$vsDev`" >nul && msbuild `"$proj`" /p:Configuration=Release /p:Platform=Win32 /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0 /p:OutDir=`"$outDir`" /m /v:minimal" 2>&1 | Tee-Object -FilePath ci_logs/error.log -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Copy-Item -Force "external\cocos2d-x-2.2.6\scripting\lua\luajit\win32\lua51.dll" $outDir
          Copy-Item -Force "external\cocos2d-x-2.2.6\scripting\lua\luajit\win32\lua51.pdb" $outDir

      - name: Save Cocos2d-x + LuaJIT 2.0.1 cache eagerly
        if: steps.cache-cocos.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            external/cocos2d-x-2.2.6
            build/luajit-provenance.json
          key: cocos2dx-2.2.6-luajit201-v143-v7-${{ hashFiles('tools/patch_cocos2dx.py', 'tools/build_luajit_vs2022.ps1') }}

      - name: Configure CMake (Visual Studio 17 2022, -A Win32, -T v143, /MD, CTest ON)
        shell: pwsh
        run: |
          "Configure CMake (VS2022 Win32 v143)" | Set-Content ci_logs/last_step.txt
          cmake -B build -G "Visual Studio 17 2022" -A Win32 -T v143 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x86-windows `
            -DGCLIENT_COCOS2DX_ROOT="${{ github.workspace }}/external/cocos2d-x-2.2.6" `
            -DGCLIENT_COCOS2DX_LIB_DIR="${{ github.workspace }}/external/cocos2d-x-2.2.6/Release.win32" `
            -DGCLIENT_LUAJIT_LIB_DIR="${{ github.workspace }}/external/cocos2d-x-2.2.6/scripting/lua/luajit/win32" `
            -DGCLIENT_REQUIRE_FRESH_LUAJIT=ON `
            -DGCLIENT_SHIPPING_RELEASE=ON `
            -DGCLIENT_BUILD_TESTS=ON 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build GCLIENT.exe & Regression/LuaJIT ABI Test Targets (Release Win32)
        shell: pwsh
        run: |
          "Build GCLIENT.exe & CTest targets" | Set-Content ci_logs/last_step.txt
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute CTest C++17 Regression, LuaJIT 2.0.1 ABI & Python PE Gate Suites
        shell: pwsh
        run: |
          "Run CTest regression & LuaJIT ABI suites" | Set-Content ci_logs/last_step.txt
          ctest --test-dir build -C Release --output-on-failure --verbose 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage Clean Release Closure & Run Recursive PE32 / CRT / LuaJIT Provenance Gate
        shell: pwsh
        run: |
          "Stage release & run recursive PE32/CRT dependency gate" | Set-Content ci_logs/last_step.txt
          New-Item -ItemType Directory -Force -Path dist/gclient-win32-release | Out-Null
          New-Item -ItemType Directory -Force -Path dist/gclient-win32-symbols | Out-Null

          python tools/audit_pe_dependencies.py dist/gclient-win32-release `
            --stage-from-root-exe build/Release/GCLIENT.exe `
            --search-dir "external/cocos2d-x-2.2.6/scripting/lua/luajit/win32" `
            --search-dir "external/cocos2d-x-2.2.6/Release.win32" `
            --search-dir "build/Release" `
            --search-dir "$env:VCPKG_INSTALLATION_ROOT/installed/x86-windows/bin" `
            --search-dir "${{ steps.vs-env.outputs.vcredist_x86 }}" `
            --pdb-output-dir dist/gclient-win32-symbols `
            --luajit-provenance build/luajit-provenance.json `
            --require-app-local-vc-redist `
            --fail-on-unreferenced `
            --dumpbin "${{ steps.vs-env.outputs.dumpbin }}" 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          Copy-Item -Force build/luajit-provenance.json dist/gclient-win32-symbols/luajit-provenance.json

      - name: Run Deterministic Win32 Startup & Unicode Smoke Harness
        shell: pwsh
        run: |
          "Run Win32 startup & Unicode smoke harness" | Set-Content ci_logs/last_step.txt
          pwsh -NoProfile -ExecutionPolicy Bypass -File tools/smoke_test_win32.ps1 `
            -ArtifactDir "${{ github.workspace }}/dist/gclient-win32-release" `
            -ReportPath "${{ github.workspace }}/dist/gclient-win32-release/smoke-test-report.json" 2>&1 | Tee-Object -FilePath ci_logs/error.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          python -c "import pathlib, sys; sys.path.insert(0, 'tools'); import audit_pe_dependencies as a; d = pathlib.Path('dist/gclient-win32-release'); a.write_sha256_sums(d, d / 'SHA256SUMS.txt')"

      - name: Upload Clean Win32 Release Artifact (gclient-win32-release)
        uses: actions/upload-artifact@v4
        with:
          name: gclient-win32-release
          path: dist/gclient-win32-release/*
          if-no-files-found: error

      - name: Upload Win32 PDB Symbol Bundle (gclient-win32-symbols)
        uses: actions/upload-artifact@v4
        with:
          name: gclient-win32-symbols
          path: dist/gclient-win32-symbols/*
          if-no-files-found: error

      - name: Publish Closed CI Verification Evidence Record
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const sha = context.sha.substring(0, 8);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const readSafe = (p, maxLen = 18000) => fs.existsSync(p) ? fs.readFileSync(p, 'utf8').slice(0, maxLen) : '(missing)';

            const prov = readSafe('build/luajit-provenance.json', 4000);
            const sums = readSafe('dist/gclient-win32-release/SHA256SUMS.txt', 6000);
            const smoke = readSafe('dist/gclient-win32-release/smoke-test-report.json', 8000);
            let depSummary = '(missing)';
            if (fs.existsSync('dist/gclient-win32-release/dependency-manifest.json')) {
              const dm = JSON.parse(fs.readFileSync('dist/gclient-win32-release/dependency-manifest.json', 'utf8'));
              const compact = {
                passed: dm.passed,
                total_binaries: dm.total_binaries,
                transitive_closure_shipped: dm.transitive_closure_shipped,
                vc_redist_crt_dependencies: dm.vc_redist_crt_dependencies,
                transitive_os_dependencies: dm.transitive_os_dependencies,
                unreferenced_staged_binaries: dm.unreferenced_staged_binaries,
                violations: dm.violations,
                binaries: (dm.binaries || []).map(b => ({
                  filename: b.filename,
                  machine: b.machine_name,
                  pe_magic: b.pe_format,
                  linker: b.linker_version,
                  pdb_path: b.pdb_path,
                  direct_imports: (b.direct_imports || []).map(i => i.dll_name),
                  delay_imports: (b.delay_imports || []).map(i => i.dll_name),
                  export_count: b.export_count
                }))
              };
              depSummary = JSON.stringify(compact, null, 2).slice(0, 22000);
            }

            try {
              await github.rest.issues.createLabel({ owner, repo, name: 'ci-verified', color: '0e8a16', description: 'Automated Win32 CI verification manifest' });
            } catch (_) {}

            const body = [
              `### Win32 VS2022 v143 Release Verification Passed`,
              `- **Commit:** \`${context.sha}\``,
              `- **Workflow Run:** ${runUrl}`,
              ``,
              `#### 1. Rebuilt LuaJIT 2.0.1 Provenance (\`luajit-provenance.json\`)`,
              '```json',
              prov,
              '```',
              `#### 2. Release Artifact SHA-256 Checksums (\`SHA256SUMS.txt\`)`,
              '```text',
              sums,
              '```',
              `#### 3. Win32 Startup & Unicode Smoke Report (\`smoke-test-report.json\`)`,
              '```json',
              smoke,
              '```',
              `#### 4. Recursive PE32 & CRT Dependency Manifest (\`dependency-manifest.json\`)`,
              '```json',
              depSummary,
              '```'
            ].join('\n').slice(0, 62000);

            const created = await github.rest.issues.create({
              owner, repo,
              title: `[CI Verified] Win32 v143 Release (${sha})`,
              labels: ['ci-verified'],
              body
            });
            await github.rest.issues.update({
              owner, repo,
              issue_number: created.data.number,
              state: 'closed',
              state_reason: 'completed'
            });

  ci-issue-sync:
    name: Synchronize CI error issues
    needs: [validate-and-unit-test, build-win32]
    if: ${{ always() && !cancelled() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Create, update or close CI error issues
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ needs.validate-and-unit-test.result }}
          BUILD_RESULT: ${{ needs.build-win32.result }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const label = 'ci-error';
            const aliases = [label, 'ci error', 'ci-failure'];
            const results = [process.env.VALIDATION_RESULT, process.env.BUILD_RESULT];
            const failed = results.includes('failure');
            const passed = results.every(result => result === 'success');
            if (!failed && !passed) {
              core.info('No definitive CI result; leaving issues unchanged.');
              return;
            }

            // Do not let a rerun of an obsolete commit alter main's issue state.
            const { data: branch } = await github.rest.repos.getBranch({
              owner, repo, branch: 'main'
            });
            if (branch.commit.sha !== context.sha) {
              core.info('Superseded main commit; leaving issues unchanged.');
              return;
            }

            const runUrl = context.serverUrl + '/' + owner + '/' + repo + '/actions/runs/' + context.runId;
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            const marker = '<!-- ci-run:' + context.runId + ':' + attempt + ' -->';
            const sha = context.sha.slice(0, 8);

            async function ensureLabel() {
              try {
                await github.rest.issues.getLabel({ owner, repo, name: label });
              } catch (error) {
                if (error.status !== 404) throw error;
                try {
                  await github.rest.issues.createLabel({
                    owner, repo, name: label, color: 'd73a4a',
                    description: 'Automated CI failure report'
                  });
                } catch (createError) {
                  if (createError.status !== 422) throw createError;
                  await github.rest.issues.getLabel({ owner, repo, name: label });
                }
              }
            }

            const byNumber = new Map();
            for (const name of aliases) {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                owner, repo, state: 'open', labels: name, per_page: 100
              });
              for (const issue of issues) {
                if (!issue.pull_request) byNumber.set(issue.number, issue);
              }
            }
            const open = [...byNumber.values()].sort((a, b) => b.number - a.number);

            if (passed) {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: 'All validation and Win32 build jobs passed on commit ' + sha +
                    ' ([CI run](' + runUrl + ')). Automatically closing this CI error.'
                });
                await github.rest.issues.update({
                  owner, repo, issue_number: issue.number,
                  state: 'closed', state_reason: 'completed'
                });
              }
              core.info('Closed ' + open.length + ' CI error issue(s).');
              return;
            }

            await ensureLabel();
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              owner, repo, run_id: context.runId, filter: 'latest', per_page: 100
            });
            const failedJobs = jobs.filter(job => job.conclusion === 'failure' &&
              job.name !== 'Synchronize CI error issues');
            const details = failedJobs.flatMap(job => [
              '- **Job:** [' + job.name + '](' + job.html_url + ')',
              ...((job.steps || []).filter(step => step.conclusion === 'failure')
                .map(step => '  - Failed step: ' + step.name))
            ]);
            const first = failedJobs[0];
            const step = first?.steps?.find(step => step.conclusion === 'failure');
            const reason = step?.name || first?.name || 'Validation or Win32 build';
            const title = ('[CI Error] ' + reason + ' (' + sha + ')').slice(0, 240);
            const body = [
              marker,
              '### CI failed on main',
              '- Commit: ' + context.sha,
              '- Workflow: [Run ' + context.runId + ', attempt ' + attempt + '](' + runUrl + ')',
              '- Validation: ' + results[0],
              '- Win32 build: ' + results[1],
              '',
              '### Failed jobs and steps',
              ...(details.length ? details : ['See the workflow run for failure details.']),
              '',
              'Full logs are available through the linked jobs. This issue closes automatically after successful CI on main.'
            ].join('\n');

            if (!open.length) {
              await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.info('Created CI error issue.');
              return;
            }

            // Reuse the existing incident; preserve its previous reports and discussion.
            const issue = open[0];
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: issue.number, per_page: 100
            });
            if (!(issue.body || '').includes(marker) &&
                !comments.some(comment => (comment.body || '').includes(marker))) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issue.number, body
              });
            }
            await github.rest.issues.addLabels({
              owner, repo, issue_number: issue.number, labels: [label]
            });
            await github.rest.issues.update({ owner, repo, issue_number: issue.number, title });
            core.info('Updated CI error issue #' + issue.number);
